<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Will You Be My Valentine?</title>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Indie Flower', cursive;
            background-color: #ffe5ec;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 100vw;
            max-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .header_text {
            color: #ff4d6d;
            font-size: 2.5rem;
            margin-top: 0;
        }

        .gif_container img {
            max-width: 250px;
            width: 100%;
            height: auto;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 12px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #ff4d6d;
            color: white;
            font-family: 'Indie Flower', cursive;
        }

        #noButton {
            background-color: #fb6f92;
            transition: 0.1s;
        }

        @media (max-width: 600px) {
            .header_text {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="dashboard.html"
            style="position: absolute; top: 20px; left: 20px; text-decoration: none; color: #ff4d6d; font-weight: bold;">⬅
            Back to Week</a>
        <h1 class="header_text">Will you be my Valentine?</h1>
        <div class="gif_container">
            <img src="valentine_ask_bear.png" alt="Cute Bear Asking" id="main_gif">
        </div>
        <div class="buttons">
            <button class="btn" id="yesButton" onclick="nextPage()">Yes</button>
            <button class="btn" id="noButton" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <script>
        function nextPage() {
            window.location.href = "yes.html";
        }

        function moveButton() {
            const btn = document.getElementById('noButton');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>
</body>

</html>
